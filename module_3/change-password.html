<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SneakerPapi — Change Password</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../sessionChecker.js"></script>
</head>

<body>
    <img src="../Logo.png" alt3="SneakerPapi Logo" class="top-logo">

    <h1>SneakerPapi Change Password</h1>

    <h2>Set a New Password</h2>
    <form id="changePasswordForm" name="changePasswordForm">
        <p>
            <label for="newPassword">New Password:</label><br>
            <input type="password" id="newPassword" name="newPassword" required placeholder="Enter a new password">
        </p>
        <p>
            <label for="confirmPassword">Confirm Password:</label><br>
            <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Re-enter your new password">
        </p>
        <p class="show-password">
            <input type="checkbox" id="showPassword">
            <label for="showPassword">Show Password</label>
        </p>
        <button type="button" onclick="changePassword()">Update Password</button>
    </form>

    <script src="change-password.js"></script>
</body>

</html>
