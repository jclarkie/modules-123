<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SneakerPapi — Sign Up</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../sessionChecker.js"></script>
</head>

<body>
    <!-- Upper Right Logo -->
    <img src="../logo.png" alt="SneakerPapi Logo" class="top-logo">

    <h1>SneakerPapi Sign Up</h1>

    <h2>Create Your Account</h2>
    <form name="signup">
        <p>
            <label for="username">Username:</label><br>
            <input type="text" id="username" name="username" required placeholder="Choose a username">
        </p>
        <p>
            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" required placeholder="Create a password">
        </p>
        <p>
            <label for="confirmPassword">Confirm Password:</label><br>
            <input type="password" id="confirmPassword" name="confirmPassword" required
                placeholder="Re-enter your password">
        </p>

        <!-- show password toggle -->
        <p class="show-password">
            <input type="checkbox" id="showPassword">
            <label for="showPassword">Show Password</label>
        </p>

        <!-- New Role Type Dropdown -->
        <p>
            <label for="roleType">Role Type (Access Level):</label><br>
            <select id="roleType" required name="roleType">
                <option value="" disabled selected>Select permission level</option>
                <option value="admin">Admin (Full Access & Inventory Management)</option>
                <option value="staff">Staff (POS & Orders Only)</option>
            </select>
        </p>

        <!-- New Custom Role Name Text Field -->
        <p>
            <label for="roleName">Role / Badge Name:</label><br>
            <input type="text" id="roleName" name="roleName" required
                placeholder="e.g. Store Manager, Cashier 1, Admin 2">
        </p>

        <button type="button" onclick="signupUser()">Sign Up</button>
    </form>

    <script src="signup.js"></script>
</body>

</html>
