    if (!localStorage.getItem("sp_current_user")) {

    } else {

    }

    if (!localStorage.getItem("sp_users")) {
      localStorage.setItem("sp_users", JSON.stringify([
        {
          username: "admin",

          role: "admin",
          roleName: "Admin 1"
        },
        {
          username: "staff",
          password: "password123",
          role: "staff",
          roleName: "Staff 1"
        }
      ]));
    }

  </script>
